workflows:
  ios-release:
    name: Customer iOS App Store Release
    working_directory: customer

    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: yumma

    environment:
      flutter: stable
      xcode: latest

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.adgraph.yumma

    scripts:
      - name: Flutter clean
        script: |
          flutter clean

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Install CocoaPods
        script: |
          cd ios
          pod install
          cd ..

      - name: Set up iOS code signing
        script: |
          xcode-project use-profiles

      - name: Build release IPA
        script: |
          flutter build ipa \
            --release \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - customer/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
